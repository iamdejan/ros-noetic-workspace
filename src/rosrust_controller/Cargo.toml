[package]
name = "rosrust_controller"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.9"
rosrust = "0.9"
rosrust_msg = "0.1"

[profile.release]
opt-level = "z"   # Optimize for size ("s" is another option to experiment with)
lto = true        # Enable Link Time Optimization for dead code elimination
codegen-units = 1 # Maximize size reduction, but increases compile time
strip = true      # Automatically strip symbols from the binary
